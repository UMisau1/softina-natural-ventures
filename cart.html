<!DOCTYPE html>
<html lang="ha">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Order | Softina Natural Ventures</title>

    <link rel="stylesheet"
          href="css/products.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        .cart-page {
            width: 90%;
            max-width: 1000px;
            margin: 60px auto;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .cart-title h1 {
            color: #10251b;
            font-size: 38px;
        }

        .cart-items {
            display: grid;
            gap: 15px;
        }

        .cart-item {
            background: white;
            padding: 18px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 20px;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .cart-item img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-item h3 {
            color: #10251b;
        }

        .cart-item p {
            font-size: 14px;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 7px;
        }

        .cart-quantity button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #087443;
            color: white;
            cursor: pointer;
        }

        .remove-btn {
            border: none;
            background: #ffe8e8;
            color: #b00020;
            padding: 9px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .cart-summary {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .cart-summary h2 {
            color: #10251b;
            margin-bottom: 15px;
        }

        .whatsapp-order {
            display: block;
            width: 100%;
            margin-top: 20px;
            border: none;
            background: #25d366;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-shopping {
            display: inline-block;
            margin-top: 20px;
            color: #087443;
            font-weight: bold;
            text-decoration: none;
        }

        .empty-cart {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 15px;
        }

        .empty-cart i {
            font-size: 55px;
            color: #087443;
            margin-bottom: 20px;
        }

        @media(max-width:600px) {

            .cart-item {
                grid-template-columns: 70px 1fr;
            }

            .cart-item img {
                width: 70px;
                height: 70px;
            }

            .remove-btn {
                grid-column: 2;
            }

        }

    </style>

</head>


<body>

<header class="products-header">

    <a href="index.html" class="brand">
        <i class="fa-solid fa-leaf"></i>
        SOFTINA NATURAL VENTURES
    </a>

    <a href="products.html" class="back-home">
        <i class="fa-solid fa-store"></i>
        Products
    </a>

</header>


<main class="cart-page">

    <div class="cart-title">

        <h1>
            <i class="fa-solid fa-cart-shopping"></i>
            My Order
        </h1>

        <p>
            Review your selected products before sending your order.
        </p>

    </div>


    <div id="cartContainer"></div>


</main>


<footer>

    <p>
        &copy; <span id="year"></span>
        Softina Natural Ventures. All Rights Reserved.
    </p>

</footer>


<script src="js/cart.js"></script>

</body>

</html>
